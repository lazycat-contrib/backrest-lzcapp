version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.appbackrest.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: backrest

build:
  toolchains: []
  run_buildscript: false

images:
  - id: backrest
    target: service
    service: backrest
    source: docker.io/garethgeorge/backrest
    channel: stable
    sort: semver
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    version_regex: '^v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: true
    changelog_locales: [zh, en]
    retry:
      enabled: false
      max_attempts: 3
      initial_delay: 2s
      max_delay: 30s
    application:
      language: zh
      name: Backrest
      source: https://github.com/garethgeorge/backrest
      source_author: garethgeorge
  private:
    enabled: true
    skip_if_version_exists: true
    name: Backrest
    summary: Published from GitHub Actions
